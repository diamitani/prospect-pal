<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary)}.wrap{padding:18px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-data);font-size:10px}.lbl{font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:0}.lbl>span{flex:1}</style></head><body><div class="wrap">
<div style="display:flex;align-items:flex-end;gap:6px">
<div style="text-align:center"><div style="width:2px;height:2px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">2</div></div><div style="text-align:center"><div style="width:4px;height:4px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">4</div></div><div style="text-align:center"><div style="width:6px;height:6px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">6</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">8</div></div><div style="text-align:center"><div style="width:10px;height:10px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">10</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--cobalt-500);border-radius:2px"></div><div style="font-family:var(--font-data);font-size:9px;color:var(--text-muted);margin-top:6px">64</div></div>
</div><div class="lbl" style="display:block">--space-1 … --space-24</div></div></body></html>
