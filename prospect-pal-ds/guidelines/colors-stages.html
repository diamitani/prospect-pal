<!-- @dsCard group="Colors" viewport="700x130" name="Pipeline stage hues" subtitle="Fixed colour per node family across the 9-node graph" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary)}.wrap{padding:18px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-data);font-size:10px}.lbl{font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:0}.lbl>span{flex:1}</style></head><body><div class="wrap">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
<div style="background:var(--surface-deep);border-radius:var(--radius-md);padding:10px"><div style="height:20px;border-radius:var(--radius-xs);background:var(--stage-trigger)"></div><div style="font-size:11px;font-weight:600;color:#fff;margin-top:8px">trigger</div><div style="font-family:var(--font-data);font-size:10px;color:var(--ink-400)">--stage-trigger</div></div><div style="background:var(--surface-deep);border-radius:var(--radius-md);padding:10px"><div style="height:20px;border-radius:var(--radius-xs);background:var(--stage-shield)"></div><div style="font-size:11px;font-weight:600;color:#fff;margin-top:8px">shield</div><div style="font-family:var(--font-data);font-size:10px;color:var(--ink-400)">--stage-shield</div></div><div style="background:var(--surface-deep);border-radius:var(--radius-md);padding:10px"><div style="height:20px;border-radius:var(--radius-xs);background:var(--stage-data)"></div><div style="font-size:11px;font-weight:600;color:#fff;margin-top:8px">data</div><div style="font-family:var(--font-data);font-size:10px;color:var(--ink-400)">--stage-data</div></div><div style="background:var(--surface-deep);border-radius:var(--radius-md);padding:10px"><div style="height:20px;border-radius:var(--radius-xs);background:var(--stage-ai)"></div><div style="font-size:11px;font-weight:600;color:#fff;margin-top:8px">ai</div><div style="font-family:var(--font-data);font-size:10px;color:var(--ink-400)">--stage-ai</div></div><div style="background:var(--surface-deep);border-radius:var(--radius-md);padding:10px"><div style="height:20px;border-radius:var(--radius-xs);background:var(--stage-sequence)"></div><div style="font-size:11px;font-weight:600;color:#fff;margin-top:8px">sequence</div><div style="font-family:var(--font-data);font-size:10px;color:var(--ink-400)">--stage-sequence</div></div><div style="background:var(--surface-deep);border-radius:var(--radius-md);padding:10px"><div style="height:20px;border-radius:var(--radius-xs);background:var(--stage-logic)"></div><div style="font-size:11px;font-weight:600;color:#fff;margin-top:8px">logic</div><div style="font-family:var(--font-data);font-size:10px;color:var(--ink-400)">--stage-logic</div></div>
</div></div></body></html>
