<!-- @dsCard group="Colors" viewport="700x120" name="Paper scale" subtitle="Warm-white page, card, sunken and border tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary)}.wrap{padding:18px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-data);font-size:10px}.lbl{font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:0}.lbl>span{flex:1}</style></head><body><div class="wrap"><div class="sw"><div style="background:var(--paper-0);color:var(--ink-700)">0</div><div style="background:var(--paper-50);color:var(--ink-700)">50</div><div style="background:var(--paper-100);color:var(--ink-700)">100</div><div style="background:var(--paper-200);color:var(--ink-700)">200</div><div style="background:var(--paper-300);color:var(--ink-700)">300</div></div><div class="lbl"><span>0 card</span><span>50 page</span><span>100 sunken</span><span>200 hairline</span><span>300 border</span></div></div></body></html>
