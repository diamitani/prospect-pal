<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary)}.wrap{padding:18px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-data);font-size:10px}.lbl{font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:0}.lbl>span{flex:1}</style></head><body><div class="wrap"><div class="sw"><div style="background:var(--champagne-50);color:var(--ink-700)">50</div><div style="background:var(--champagne-100);color:var(--ink-700)">100</div><div style="background:var(--champagne-200);color:var(--ink-700)">200</div><div style="background:var(--champagne-300);color:var(--ink-700)">300</div><div style="background:var(--champagne-400);color:#fff">400</div><div style="background:var(--champagne-500);color:#fff">500</div></div><div class="lbl"><span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span></div></div></body></html>
