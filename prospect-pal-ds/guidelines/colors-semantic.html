<!-- @dsCard group="Colors" viewport="700x140" name="Status colors" subtitle="Run states: approved, needs-clarification, blocked, info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary)}.wrap{padding:18px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-data);font-size:10px}.lbl{font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:0}.lbl>span{flex:1}</style></head><body><div class="wrap">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border-radius:var(--radius-md);background:var(--signal-verified-bg);padding:12px"><div style="width:100%;height:24px;border-radius:var(--radius-xs);background:var(--signal-verified)"></div><div style="font-size:12px;font-weight:600;color:var(--signal-verified);margin-top:8px">approved</div><div style="font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:2px">--signal-verified</div></div><div style="border-radius:var(--radius-md);background:var(--signal-attention-bg);padding:12px"><div style="width:100%;height:24px;border-radius:var(--radius-xs);background:var(--signal-attention)"></div><div style="font-size:12px;font-weight:600;color:var(--signal-attention);margin-top:8px">needs-clarification</div><div style="font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:2px">--signal-attention</div></div><div style="border-radius:var(--radius-md);background:var(--signal-blocked-bg);padding:12px"><div style="width:100%;height:24px;border-radius:var(--radius-xs);background:var(--signal-blocked)"></div><div style="font-size:12px;font-weight:600;color:var(--signal-blocked);margin-top:8px">blocked</div><div style="font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:2px">--signal-blocked</div></div><div style="border-radius:var(--radius-md);background:var(--signal-info-bg);padding:12px"><div style="width:100%;height:24px;border-radius:var(--radius-xs);background:var(--signal-info)"></div><div style="font-size:12px;font-weight:600;color:var(--signal-info);margin-top:8px">info</div><div style="font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:2px">--signal-info</div></div>
</div></div></body></html>
