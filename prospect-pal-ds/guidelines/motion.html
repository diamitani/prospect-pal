<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary)}.wrap{padding:18px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-data);font-size:10px}.lbl{font-family:var(--font-data);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:0}.lbl>span{flex:1}</style></head><body><div class="wrap">
<div style="display:flex;gap:14px;align-items:stretch">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);padding:14px;font-family:var(--font-data);font-size:11px;color:var(--ink-600);line-height:1.8">instant 80ms<br>fast 150ms — controls<br>base 220ms — surfaces<br>slow 380ms — overlays</div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);padding:14px;font-family:var(--font-data);font-size:11px;color:var(--ink-600);line-height:1.8">standard (0.2,0,0.2,1)<br>entrance (0.16,1,0.3,1)<br>hover translateY(-2px)<br>press scale(0.985)</div>
<div style="flex:1;background:var(--surface-deep);border-radius:var(--radius-lg);padding:14px;color:var(--ink-200);font-size:11px;line-height:1.7">Ambient only where something is genuinely live: the 3s status-dot pulse. No bounces, no parallax, no scroll-jacking.</div>
</div></div></body></html>
