<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Frame 6 — CTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: #fdfae7;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .grid-layer {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,43,250,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,43,250,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle at center, rgba(30,43,250,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; text-align: center; }
    .badge {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(30,43,250,0.08);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      color: #1e2bfa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .wordmark {
      font-size: 96px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }
    .wordmark .prospect { color: #111111; }
    .wordmark .pal { color: #1e2bfa; }
    .tagline {
      font-size: 32px;
      font-weight: 500;
      color: #525252;
      margin-bottom: 48px;
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 24px 56px;
      background: #1e2bfa;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      border-radius: 100px;
      letter-spacing: 0.02em;
      box-shadow: 0 20px 60px rgba(30,43,250,0.35);
      margin-bottom: 24px;
    }
    .cta-arrow { font-size: 20px; }
    .url {
      font-size: 20px;
      font-weight: 500;
      color: #1e2bfa;
      letter-spacing: 0.03em;
    }

    .corner-accent {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 3px solid rgba(30,43,250,0.1);
    }
    .corner-accent.tl { top: 60px; left: 60px; border-right: none; border-bottom: none; }
    .corner-accent.tr { top: 60px; right: 60px; border-left: none; border-bottom: none; }
    .corner-accent.bl { bottom: 60px; left: 60px; border-right: none; border-top: none; }
    .corner-accent.br { bottom: 60px; right: 60px; border-left: none; border-top: none; }
  </style>
</head>
<body>
  <div data-hf-id="hf-7mc6" data-composition-id="06-cta" data-width="1920" data-height="1080" style="width:1920px;height:1080px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <div data-hf-id="hf-3rbk" class="grid-layer"></div>
  <div data-hf-id="hf-2s7n" class="glow"></div>

  <div data-hf-id="hf-rage" class="corner-accent tl"></div>
  <div data-hf-id="hf-bp2w" class="corner-accent tr"></div>
  <div data-hf-id="hf-2a5o" class="corner-accent bl"></div>
  <div data-hf-id="hf-d94q" class="corner-accent br"></div>

  <div data-hf-id="hf-mcm7" class="content">
    <div data-hf-id="hf-a82j" class="badge">Agent Copilot for Outbound</div>
    <div data-hf-id="hf-cb03" class="wordmark">
      <span data-hf-id="hf-654d" class="prospect">PROSPECT</span> <span data-hf-id="hf-ujmt" class="pal">PAL</span>
    </div>
    <div data-hf-id="hf-w8yo" class="tagline">Start building.</div>
    <div data-hf-id="hf-2dzm" class="cta-button">
      Get Started Free
      <span data-hf-id="hf-on11" class="cta-arrow">→</span>
    </div>
    <div data-hf-id="hf-1gh9" class="url">prospectpal.dev</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Initial states
    gsap.set('.glow', { opacity: 0, scale: 0.5 });
    gsap.set('.corner-accent', { opacity: 0 });
    gsap.set('.badge', { opacity: 0, y: -20 });
    gsap.set('.prospect', { opacity: 0, x: -30 });
    gsap.set('.pal', { opacity: 0, x: 30, scale: 0.9 });
    gsap.set('.tagline', { opacity: 0, y: 20 });
    gsap.set('.cta-button', { opacity: 0, y: 30, scale: 0.95 });
    gsap.set('.url', { opacity: 0 });

    // Scene 1 (0.0-1.5s): Stage setup, glow, corners
    tl.to('.glow', { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 0);
    tl.to('.corner-accent', { opacity: 1, duration: 0.5, ease: 'power3.out', stagger: 0.08 }, 0.3);

    // Scene 2 (1.5-2.5s): Wordmark assembles
    tl.to('.badge', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.8);
    tl.to('.prospect', { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 1.2);
    tl.to('.pal', { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: 'back.out(1.4)' }, 1.5);

    // Scene 3 (2.5-3.5s): Tagline
    tl.to('.tagline', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 2.5);

    // Scene 4 (3.5-5.0s): CTA button and URL
    tl.to('.cta-button', { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 3.5);
    tl.to('.url', { opacity: 1, duration: 0.4, ease: 'power3.out' }, 4.0);

    // Final hold - clean lockup

    window.__timelines['06-cta'] = tl;
  </script>
  </div>
</body>
</html>
