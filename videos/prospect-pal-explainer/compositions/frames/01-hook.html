<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Frame 1 — Hook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: #fdfae7;
      font-family: 'Space Grotesk', sans-serif;
      position: relative;
    }

    .grid-layer {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,43,250,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,43,250,0.04) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    .glow-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(30,43,250,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .content {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1;
    }

    .eyebrow {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(30,43,250,0.08);
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      color: #1e2bfa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .question { max-width: 1200px; }

    .question-line-1 {
      font-size: 88px;
      font-weight: 700;
      color: #111111;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .word { display: inline-block; }

    .highlight {
      color: #1e2bfa;
      position: relative;
    }

    .highlight-underline {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(30,43,250,0.15);
      border-radius: 3px;
      transform-origin: left;
    }

    .question-line-2 {
      font-size: 72px;
      font-weight: 500;
      color: #111111;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .accent-bar {
      position: absolute;
      width: 80px;
      height: 4px;
      background: #1e2bfa;
      border-radius: 2px;
    }
    .accent-bar.top-left { top: 100px; left: 100px; }
    .accent-bar.bottom-right { bottom: 100px; right: 100px; }

    .corner-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(30,43,250,0.2);
      border-radius: 50%;
    }
    .corner-dot.tl { top: 60px; left: 60px; }
    .corner-dot.tr { top: 60px; right: 60px; }
    .corner-dot.bl { bottom: 60px; left: 60px; }
    .corner-dot.br { bottom: 60px; right: 60px; }
  </style>
</head>
<body>
  <div data-hf-id="hf-ndu4" data-composition-id="01-hook" data-width="1920" data-height="1080" style="width:1920px;height:1080px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <div data-hf-id="hf-3rbk" class="grid-layer"></div>
  <div data-hf-id="hf-5ikr" class="glow-layer"></div>
  <div data-hf-id="hf-bs7f" class="accent-bar top-left"></div>
  <div data-hf-id="hf-h7d6" class="accent-bar bottom-right"></div>
  <div data-hf-id="hf-42zj" class="corner-dot tl"></div>
  <div data-hf-id="hf-lb5t" class="corner-dot tr"></div>
  <div data-hf-id="hf-7max" class="corner-dot bl"></div>
  <div data-hf-id="hf-99br" class="corner-dot br"></div>

  <div data-hf-id="hf-mcm7" class="content">
    <div data-hf-id="hf-yn9v" class="eyebrow">Agent Copilot for Outbound</div>
    <div data-hf-id="hf-xmh0" class="question">
      <div data-hf-id="hf-aacl" class="question-line-1">
        <span data-hf-id="hf-zhfl" class="word w1">What</span>
        <span data-hf-id="hf-9ul3" class="word w2">if</span>
        <span data-hf-id="hf-qcht" class="word w3">building</span>
        <span data-hf-id="hf-oe2v" class="highlight">
          <span data-hf-id="hf-sq4y" class="word w4">outbound</span>
          <span data-hf-id="hf-7da0" class="word w5">automation</span>
          <span data-hf-id="hf-1qdg" class="highlight-underline"></span>
        </span>
      </div>
      <div data-hf-id="hf-e8gm" class="question-line-2">
        <span data-hf-id="hf-8a9d" class="word w6">was</span>
        <span data-hf-id="hf-ni9h" class="word w7">as</span>
        <span data-hf-id="hf-8dvk" class="word w8">simple</span>
        <span data-hf-id="hf-ogun" class="word w9">as</span>
        <span data-hf-id="hf-09jr" class="word w10">describing</span>
        <span data-hf-id="hf-mk06" class="word w11">it?</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Initial states - everything hidden
    gsap.set('.eyebrow', { opacity: 0, y: 20 });
    gsap.set('.word', { opacity: 0, y: 30 });
    gsap.set('.highlight-underline', { scaleX: 0 });
    gsap.set('.accent-bar', { scaleX: 0 });
    gsap.set('.corner-dot', { scale: 0 });
    gsap.set('.glow-layer', { opacity: 0, scale: 0.8 });

    // Scene 1 (0.0-1.5s): Eyebrow + "What if building" enter
    tl.to('.glow-layer', { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 0);
    tl.to('.eyebrow', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.2);
    tl.to('.corner-dot', { scale: 1, duration: 0.4, ease: 'power3.out', stagger: 0.05 }, 0.3);
    tl.to('.accent-bar', { scaleX: 1, duration: 0.5, ease: 'power3.out', stagger: 0.1 }, 0.4);
    tl.to('.w1', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.6);
    tl.to('.w2', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.75);
    tl.to('.w3', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.9);

    // Scene 2 (1.5-3.0s): "outbound automation" with emphasis
    tl.to('.w4', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.5);
    tl.to('.w5', { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.2)' }, 1.9);
    tl.to('.highlight-underline', { scaleX: 1, duration: 0.6, ease: 'power3.out' }, 2.2);

    // Scene 3 (3.0-4.2s): Second line enters word by word
    tl.to('.w6', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 3.0);
    tl.to('.w7', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 3.15);
    tl.to('.w8', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 3.3);
    tl.to('.w9', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 3.45);
    tl.to('.w10', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 3.6);
    tl.to('.w11', { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 3.8);

    // Scene 4 (4.2-5.0s): Hold with subtle pulse on question mark
    tl.to('.w11', { scale: 1.05, duration: 0.3, ease: 'power2.out' }, 4.3);
    tl.to('.w11', { scale: 1, duration: 0.4, ease: 'power2.inOut' }, 4.6);

    window.__timelines['01-hook'] = tl;
  </script>
  </div>
</body>
</html>
