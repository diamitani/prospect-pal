<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1920px;
        height: 1080px;
        background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #09090b 100%);
        color: #ffffff;
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      #root {
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        font-weight: 700;
        color: #818cf8;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.4);
        padding: 8px 24px;
        border-radius: 9999px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 20px;
        opacity: 0;
      }
      .headline {
        font-family: "Space Grotesk", sans-serif;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.15;
        text-align: center;
        max-width: 1200px;
        margin-bottom: 50px;
        opacity: 0;
      }
      .headline em {
        font-style: normal;
        color: #38bdf8;
        text-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
      }
      .stats-grid {
        display: flex;
        gap: 32px;
        margin-bottom: 60px;
      }
      .stat-card {
        background: rgba(24, 24, 27, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 36px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        backdrop-filter: blur(16px);
        width: 320px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      .stat-val {
        font-family: "Space Grotesk", sans-serif;
        font-size: 64px;
        font-weight: 700;
        color: #38bdf8;
        text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      }
      .stat-lbl {
        font-size: 16px;
        font-weight: 500;
        color: #a1a1aa;
        text-align: center;
      }
      .cta-btn {
        background: #ffffff;
        color: #09090b;
        font-family: "Space Grotesk", sans-serif;
        font-size: 24px;
        font-weight: 700;
        padding: 22px 56px;
        border-radius: 9999px;
        box-shadow: 0 0 50px rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        gap: 16px;
        opacity: 0;
      }
      .cta-arrow {
        font-size: 28px;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="05-impact-cta-host"
      data-width="1920"
      data-height="1080"
    >
      <div class="eyebrow" id="eyebrow">UNLEASH YOUR PIPELINE</div>
      <h1 class="headline" id="headline">
        Deploy your engine in <em>under three minutes.</em>
      </h1>

      <div class="stats-grid">
        <div class="stat-card" id="s-1">
          <div class="stat-val">10x</div>
          <div class="stat-lbl">SDR Efficiency Gain</div>
        </div>
        <div class="stat-card" id="s-2">
          <div class="stat-val" style="color: #4ade80">0%</div>
          <div class="stat-lbl">CRM Lead Collisions</div>
        </div>
        <div class="stat-card" id="s-3">
          <div class="stat-val" style="color: #c084fc">&lt; 3m</div>
          <div class="stat-lbl">Time to Value</div>
        </div>
      </div>

      <div class="cta-btn" id="cta">
        <span>prospectpal.ai — Start Building Free</span>
        <span class="cta-arrow">→</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["05-impact-cta-host"] = tl;

      tl.fromTo("#eyebrow", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2)
        .fromTo("#headline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 0.5)
        .fromTo(".stat-card", { opacity: 0, scale: 0.85 }, {
          opacity: 1,
          scale: 1,
          duration: 0.6,
          stagger: 0.2,
          ease: "back.out(1.5)",
        }, 1.0)
        .fromTo("#cta", { opacity: 0, y: 30 }, {
          opacity: 1,
          y: 0,
          duration: 0.7,
          ease: "elastic.out(1, 0.75)",
        }, 2.5)
        .to("#cta", {
          boxShadow: "0 0 70px rgba(56, 189, 248, 0.6)",
          repeat: 3,
          yoyo: true,
          duration: 0.8,
        }, 3.5);
    </script>
  </body>
</html>
